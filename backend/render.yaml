services:
  - type: web
    name: clinixlens-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinixlens-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://clinixlens.vercel.app,http://localhost:5173"

databases:
  - name: clinixlens-db
    databaseName: clinixlens
    user: clinixlens_user
